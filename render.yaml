services:
  - type: worker
    name: helpsmart3-bot
    runtime: python
    plan: starter
    autoDeploy: true
    repo: https://github.com/botghaith/botghaith
    branch: main
    buildCommand: python --version && pip install -r requirements.txt && python setup_translate.py
    startCommand: python setup_translate.py && python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        value: qhaith
      - key: DATABASE_PATH
        value: data/bot.db
      - key: TEMP_DIR
        value: data/temp
      - key: CHANNEL_USERNAME
        value: mcqthr
      - key: CHANNEL_LINK
        value: https://t.me/mcqthr
      - key: CHANNEL_REQUIRED
        value: "1"
      - key: SUPABASE_URL
        value: https://qusavnejgrcxuuyunrry.supabase.co
      - key: ARGOS_PACKAGES_DIR
        value: data/argos-packages
      - key: USE_ONLINE_TRANSLATE
        value: "1"
      - key: FILE_TRANSLATE_FULL
        value: "1"
      - key: FILE_TRANSLATE_LOCAL
        value: "1"
      - key: SUPABASE_SECRET_KEY
        sync: false
